[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcfg-vault"
version = "0.9.1"
description = "批量备份/对比/审计/加密网络设备配置的 CLI — Batch backup, diff, audit & encrypt H3C/Huawei/Cisco/Ruijie device configs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["network", "h3c", "huawei", "cisco", "ruijie", "backup", "config", "netops", "automation", "sysadmin", "switch", "audit"]
authors = [{ name = "BG8CFB" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = ["paramiko>=3.4", "cryptography>=42.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://bg8cfb.github.io/netcfg-vault/"
Documentation = "https://bg8cfb.github.io/netcfg-vault/tutorial.html"
Source = "https://github.com/BG8CFB/netcfg-vault"
Changelog = "https://github.com/BG8CFB/netcfg-vault/releases"

[project.scripts]
netcfg-vault = "netcfg_vault.cli:main"

[tool.setuptools.packages.find]
include = ["netcfg_vault*"]