[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcfg-vault"
version = "0.8.0"
description = "批量备份和对比网络设备配置的命令行工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["paramiko>=3.4", "cryptography>=42.0", "PyYAML>=6.0"]

[project.scripts]
netcfg-vault = "netcfg_vault.cli:main"

[tool.setuptools.packages.find]
include = ["netcfg_vault*"]
